[build]
  command = "npm run generate"
  # Nitro picks its preset from the environment: locally that's `static`
  # (-> .output/public), but on Netlify the NETLIFY env var selects
  # `netlify-static`, which writes to ./dist instead. Nuxt symlinks
  # dist -> .output/public locally, so this path is correct in both places.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # --legacy-peer-deps for the same reason as .github/workflows/ci.yml: an
  # unsatisfiable peer range in @bomb.sh/tab (via nuxt) makes npm's strict
  # tree-building reject the lockfile.
  NPM_FLAGS = "--no-audit --no-fund --legacy-peer-deps"

# Keep the private billing page out of search engines at the edge too.
[[headers]]
  for = "/billing*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Belt and braces: cover the legacy path too, in case a crawler hits it before
# the redirect resolves.
[[headers]]
  for = "/racun*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The /racun -> /billing redirect is NOT here. Netlify reads the generated
# dist/_redirects before netlify.toml, and Nitro writes a `/* /404.html 404`
# catch-all into it that would match /racun first. It lives in nuxt.config.ts
# as a routeRule instead, so it is emitted above that catch-all.
