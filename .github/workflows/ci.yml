name: ci

on:
  push:
    branches:
      - main
      - master
      - master-2021
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is required: nuxt pulls in @bomb.sh/tab, whose peer
      # ranges (cac@^6.7.14, commander@^13||^14||^15) are not satisfiable
      # against the versions the tree actually hoists (cac@7, commander@11).
      # `npm install` records that as invalid-but-working; `npm ci` rebuilds the
      # ideal tree strictly and then rejects the very lockfile install wrote.
      # Relaxing peers keeps the lockfile's exact versions — unlike `npm install`,
      # which would drop reproducibility altogether.
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --legacy-peer-deps

      - name: Build static site 🏗
        run: npm run generate
