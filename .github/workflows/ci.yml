name: ci

on:
  push:
    branches:
      - main
      - master
      - master-2021
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Build static site 🏗
        run: npm run generate
